<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392"
     role="img" aria-labelledby="t d">
  <title id="t">Trench</title>
  <desc id="d">A self-hosted DNS server in pure Python. A terminal session: Trench starts on
port 5354 having compiled 44 rules from one source, then answers doubleclick.net with 0.0.0.0
because a list blocked it, and news.ycombinator.com with a real address forwarded upstream.</desc>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
         "DejaVu Sans Mono", monospace; font-size: 17px; }
    .name  { font-size: 27px; fill: #eef1f6; font-weight: 600; }
    .sub   { fill: #7d8796; }
    .cue   { fill: #4e5866; }
    .cmd   { fill: #dae0e8; }
    .out   { fill: #8b95a3; }
    .stop  { fill: #d97c7e; }
    .go    { fill: #85ad76; }
    .note  { fill: #5b6472; }
  </style>

  <rect width="1200" height="392" fill="#12151a"/>

  <text class="m name" x="56" y="60">trench</text>
  <text class="m sub"  x="56" y="92">a self-hosted DNS server in pure Python.</text>
  <text class="m sub"  x="56" y="116">sinkhole, recursive resolver, authoritative and DNSSEC, in one process.</text>

  <line x1="56" y1="150" x2="1144" y2="150" stroke="#232830" stroke-width="1"/>

  <g class="m">
    <text x="56" y="190"><tspan class="cue">$ </tspan><tspan class="cmd">python3 -m trench --dns-port 5354 --upstream 1.1.1.1:53 --source data/default_blocklist.txt</tspan></text>
    <text x="56" y="218" class="out">gravity compiled: 44 rules (44 block domains) from 1 sources</text>
    <text x="56" y="242" class="out">Do53 listening on 127.0.0.1:5354 (udp=True tcp=True)</text>

    <text x="56" y="286"><tspan class="cue">$ </tspan><tspan class="cmd">dig +short @127.0.0.1 -p 5354 doubleclick.net</tspan></text>
    <text x="56"  y="310" class="stop">0.0.0.0</text>
    <text x="270" y="310" class="note"># a list blocked it; the name was never asked of anyone</text>

    <text x="56" y="346"><tspan class="cue">$ </tspan><tspan class="cmd">dig +short @127.0.0.1 -p 5354 news.ycombinator.com</tspan></text>
    <text x="56"  y="370" class="go">209.216.230.207</text>
    <text x="270" y="370" class="note"># forwarded, and cached on the way back</text>
  </g>
</svg>
