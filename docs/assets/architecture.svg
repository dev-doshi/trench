<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="802" viewBox="0 0 1180 802" role="img" aria-labelledby="t d">
  <title id="t">How a query moves through Trench</title>
  <desc id="d">One ordered path down a single process. Validation, rate limiting and the rebinding guard can refuse a query; local zones, encrypted-DNS discovery, the filter and the cache can answer it outright and stop it going further. What survives every stage is forwarded to an upstream or resolved iteratively from the root with DNSSEC validation.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
           "DejaVu Sans Mono", monospace; font-size: 14px; }
    .h  { font-size: 15px; font-weight: 600; }
    .lg { font-size: 12px; }
    .bg   { fill: #ffffff; }
    .ink  { fill: #1b1f24; }
    .dim  { fill: #6a737d; }
    .halt { fill: #a8474c; }  .s-halt { stroke: #a8474c; }
    .here { fill: #35618e; }  .s-here { stroke: #35618e; }
    .on   { fill: #4a7c3f; }  .s-on   { stroke: #4a7c3f; }
    .rule { stroke: #d5dae0; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #12151a; }
      .ink  { fill: #e6eaf0; }
      .dim  { fill: #8b95a3; }
      .halt { fill: #d97c7e; }  .s-halt { stroke: #d97c7e; }
      .here { fill: #7fa8d4; }  .s-here { stroke: #7fa8d4; }
      .on   { fill: #85ad76; }  .s-on   { stroke: #85ad76; }
      .rule { stroke: #2a2f38; }
    }
  </style>
  <rect class="bg" width="1180" height="802"/>
  <text class="h ink" x="56" y="50">how a query moves through it</text>
  <text class="dim" x="56" y="74">one process, one ordered path, and every stage can be asked afterwards what it decided.</text>
  <circle cx="60" cy="96" r="3.5" class="halt"/>
  <text class="lg dim" x="72" y="100">refused here</text>
  <circle cx="200.8" cy="96" r="3.5" class="here"/>
  <text class="lg dim" x="212.8" y="100">answered here</text>
  <circle cx="349.0" cy="96" r="3.5" class="on"/>
  <text class="lg dim" x="361.0" y="100">carries on</text>
  <text class="ink" x="296" y="132" text-anchor="end">a query arrives</text>
  <text class="dim" x="352" y="132">over Do53, DoT, DoH, DoQ or DoH3</text>
  <path class="rule" d="M318 138V735" fill="none" stroke-width="1.5"/>
  <circle cx="318" cy="173" r="3.5" class="halt"/>
  <path class="s-halt" d="M323 173h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="178" text-anchor="end">validate</text>
  <text class="halt" x="352" y="178">malformed, or not a question</text>
  <text class="dim"  x="748" y="178">FORMERR, or nothing at all</text>
  <circle cx="318" cy="231" r="3.5" class="halt"/>
  <path class="s-halt" d="M323 231h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="236" text-anchor="end">rate limit</text>
  <text class="halt" x="352" y="236">over this client&#x27;s budget</text>
  <text class="dim"  x="748" y="236">REFUSED, and counted</text>
  <circle cx="318" cy="289" r="3.5" class="on"/>
  <path class="s-on" d="M323 289h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="294" text-anchor="end">identify client</text>
  <text class="on" x="352" y="294">by IP, CIDR, MAC or ClientID</text>
  <text class="dim"  x="748" y="294">picks the group, the lists, the upstream</text>
  <circle cx="318" cy="347" r="3.5" class="here"/>
  <path class="s-here" d="M323 347h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="352" text-anchor="end">local zones</text>
  <text class="here" x="352" y="352">a name you are authoritative for</text>
  <text class="dim"  x="748" y="352">your own record, signed if the zone is</text>
  <circle cx="318" cy="405" r="3.5" class="here"/>
  <path class="s-here" d="M323 405h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="410" text-anchor="end">discovery</text>
  <text class="here" x="352" y="410">_dns.resolver.arpa</text>
  <text class="dim"  x="748" y="410">the encrypted endpoints, per RFC 9462</text>
  <circle cx="318" cy="463" r="3.5" class="here"/>
  <path class="s-here" d="M323 463h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="468" text-anchor="end">filter</text>
  <text class="here" x="352" y="468">a rule, a list, a blocked service,</text>
  <text class="dim"  x="748" y="468">0.0.0.0, NXDOMAIN, or a rewrite</text>
  <text class="here" x="352" y="488">safe search, parental controls, a schedule</text>
  <circle cx="318" cy="541" r="3.5" class="here"/>
  <path class="s-here" d="M323 541h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="546" text-anchor="end">cache</text>
  <text class="here" x="352" y="546">a hit, or a stale one while it refreshes</text>
  <text class="dim"  x="748" y="546">the stored answer</text>
  <circle cx="318" cy="599" r="3.5" class="on"/>
  <path class="s-on" d="M323 599h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="604" text-anchor="end">resolve</text>
  <text class="on" x="352" y="604">forward: an upstream, routed per domain</text>
  <text class="dim"  x="748" y="604">over plain, TCP, DoT, DoH or DoQ</text>
  <text class="on" x="352" y="624">recurse: from the root, QNAME minimised, DNSSEC validated</text>
  <circle cx="318" cy="677" r="3.5" class="halt"/>
  <path class="s-halt" d="M323 677h20" fill="none" stroke-width="1.5"/>
  <text class="ink"  x="296" y="682" text-anchor="end">rebinding guard</text>
  <text class="halt" x="352" y="682">an answer pointing into your LAN</text>
  <text class="dim"  x="748" y="682">stripped before it reaches the client</text>
  <circle cx="318" cy="735" r="3.5" class="ink"/>
  <text class="ink" x="296" y="740" text-anchor="end">the answer</text>
  <text class="dim" x="352" y="740">logged, counted, and named stage by stage by trench why</text>
</svg>
