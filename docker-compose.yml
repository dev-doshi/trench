# DNSGuard — general-purpose Compose deployment.
#
# For a Raspberry Pi (or any host under ~1 GB of RAM) use
# deploy/docker-compose.raspi.yml instead: it adds the memory ceiling that
# keeps a blocklist rebuild from letting the kernel OOM-killer pick victims
# elsewhere on the host.
services:
  dnsguard:
    build:
      context: .
      args:
        VERSION: "2.0.0"
    image: dnsguard:latest
    container_name: dnsguard
    restart: unless-stopped
    network_mode: host # required for LAN DNS on :53
    # Everything dropped, then the single capability binding :53 needs.
    # cap_add alone leaves a root container holding CHOWN, SETUID,
    # NET_RAW and the rest of the default set.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :53 / :853
      - SETUID             # server.user: shed root once the ports are bound
      - SETGID             # ...and the matching group

    # Writable on purpose. The Settings page saves through this file, and a
    # container that could be made to rewrite it already controls resolution,
    # the blocklists and the query log — so :ro was buying very little while
    # breaking every control on that page.
    volumes:
      - ./dnsguard.yaml:/data/dnsguard.yaml
      - dnsguard-data:/data

    environment:
      - TZ=Etc/UTC

    # The image ships its own probe; this only relaxes the start period, since
    # compiling large blocklists on first boot can outlast the default.
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/dnsguard-healthcheck"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s

    # Unbounded json-file logging fills a disk quietly, and a DNS server is a
    # high-volume logger by nature.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  dnsguard-data:
