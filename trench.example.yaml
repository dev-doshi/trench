# Trench configuration. Every key is optional, and every key Trench reads is
# shown here. Values are the defaults, except where the file is also acting
# as a starter config and says so: `data_dir`, the Do53 `port`, the upstream
# `servers`, `filtering.sources`, and the `host` of each encrypted transport
# (which defaults to 127.0.0.1 like everything else — 0.0.0.0 is shown
# because a transport you turn on is usually one you want the LAN to reach).
data_dir: ./data         # relative to the working directory; /data/data in the Docker image
dev: false
uvloop: true

server:
  do53:
    enabled: true
    host: 127.0.0.1      # use 0.0.0.0 to serve the whole LAN (needs root for :53)
                         # -> if you do, see security.recursion_clients below
    port: 5354           # set 53 in production
    udp: true
    tcp: true
  # The encrypted transports default to unprivileged ports so Trench runs
  # without root; the standard ones (853 for DoT/DoQ, 443 for DoH/DoH3) need
  # privilege to bind, which `server.user` below then hands back.
  dot:                   # DNS-over-TLS (P1)
    enabled: false
    host: 0.0.0.0
    port: 8853           # 853 in production
    cert: null
    key: null
  doh:                   # DNS-over-HTTPS (P1)
    enabled: false
    host: 0.0.0.0
    port: 8443           # 443 in production
    path: /dns-query
    tls: false
  doq:                   # DNS-over-QUIC (P1)
    enabled: false
    host: 0.0.0.0
    port: 8854           # 853 in production
  doh3:                  # DNS-over-HTTP/3 (P1)
    enabled: false
    host: 0.0.0.0
    port: 8444           # 443 in production
  edns_udp_size: 1232
  workers: 1             # Do53 worker processes for multi-core; 0 = auto (CPU count)
  # Connection bounds for the stream transports (TCP/DoT). Without them a
  # connection opened and then abandoned is held for as long as the peer keeps
  # the socket alive.
  tcp_idle_timeout: 10.0   # RFC 7766 §6.2.3; 0 disables
  tcp_max_connections: 512 # per worker
  tcp_max_per_client: 32
  tcp_max_inflight: 16     # pipelined queries answered at once per connection
  # Cap on UDP queries in flight per worker. Rate limiting runs inside the
  # pipeline, so without this a flood pays for a task and a parse before
  # anything can refuse it. 0 disables.
  udp_max_inflight: 2048
  # Wire-resident fast path: answer a repeat query by replaying the bytes the
  # pipeline produced for it, patching only the transaction id and the TTLs. It
  # declines anything it cannot reproduce exactly, so turning it off changes
  # throughput and nothing else.
  fast_path: true
  fast_path_entries: 16384
  # Shed root after binding the privileged ports. Port 53 needs privilege to
  # bind and nothing after that, so a resolver that keeps root is carrying it
  # for no reason — including in the Docker image, which starts as root
  # precisely so this can hand it back. Set both on any deployment that binds
  # :53, :853 or :443.
  user: ""               # e.g. trench
  group: ""              # defaults to the user's primary group
  # Advertise this server's encrypted endpoints so clients upgrade themselves:
  # DDR (RFC 9462) answers the `_dns.resolver.arpa` query Windows 11 and Apple
  # devices already send, and DNR (RFC 9463) puts the same thing in the DHCP
  # lease. `hostname` must be a name you control that resolves to this box and
  # whose certificate this server presents — clients authenticate the
  # designation against it, and ignore one they cannot.
  discovery:
    enabled: false
    hostname: ""         # e.g. dns.example.com
    ttl: 300
    addresses: []        # this server's LAN addresses, for the DHCP option

upstream:
  servers:               # plain, tls://, https://, quic://, [/domain/]server
    - "1.1.1.1:53"
    - "tls://9.9.9.9#dns.quad9.net"
    - "https://dns.google/dns-query"
    # - "[/internal.lan/]192.168.1.1"   # per-domain routing
  strategy: parallel     # sequential | parallel | fastest | weighted
  timeout: 4.0
  mode: forward          # forward | recursive (iterative from root + QNAME-min)
  ecs: "off"             # off | forward | strip  (quoted: bare off is a YAML boolean)
  verify: true           # verify TLS certs of encrypted upstreams
  dnssec: false          # validate DNSSEC
  qname_min: true        # RFC 9156: ask each server only the part of the name it
                         # needs, so the root and the TLDs never see the whole one
  # Wall-clock and packet ceilings for one client question, including the side
  # resolutions it spawns to find nameserver addresses. These are what stop a
  # deep or hostile branch of the tree turning one query into unbounded
  # traffic; raise them only with a reason. Recursive mode only.
  recursion_budget: 5.0
  recursion_max_queries: 40
  recursion_query_timeout: 1.5   # per authoritative server, kept well under the
                                 # whole-resolution budget so a slow first
                                 # nameserver does not consume it
  # How many source ports to spread plain-UDP upstream queries over, for the
  # ephemeral-port entropy RFC 5452 asks for. 1024 gives 10 bits on top of the
  # 16-bit transaction id; 0 opens a socket per query (full entropy, +67us).
  # Only affects `udp://` upstreams — DoT/DoH/DoQ keep one connection.
  udp_source_ports: 1024
  # The AD bit is an upstream's claim that it validated DNSSEC. Relaying a claim
  # we did not make and cannot authenticate is how a plaintext-UDP spoofer gets
  # a forged answer marked "verified".
  trust_ad: auto         # auto (only from DoT/DoH/DoQ) | always | never
  trust_anchors: ""      # path to a root.key (IANA DS records or a BIND
                         # trust-anchors block). Empty uses <data_dir>/root.key
                         # if present, else the anchors built into this release.
  groups: {}             # named upstream sets, chosen per client:
    # family: ["1.1.1.3:53", "1.0.0.3:53"]
    # work:   ["tls://10.0.0.1#dns.corp"]
    # Answers are cached per group, so one group never serves another's.

cache:
  enabled: true
  max_entries: 100000
  min_ttl: 0
  max_ttl: 86400
  negative_ttl: 900
  serve_stale: true
  serve_stale_max: 86400
  prefetch: true
  serve_stale_client_timeout: 1.8   # RFC 8767 §6 recommends <= 1.8s; 0 = wait
  persist: false         # save and restore the cache across restarts
  # Learned prewarm: track query popularity (persisted) and refresh the top
  # names before their TTLs lapse.
  prewarm: false
  prewarm_top: 50
  prewarm_interval: 300  # seconds between sweeps
  shared: true           # in multi-worker mode, share one cache across workers (mmap)
  shared_slots: 16384    # ~ shared_slots * (22 + shared_payload) bytes of shared RAM
  shared_payload: 1232

filtering:
  enabled: true
  sources:
    - data/default_blocklist.txt
    # - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  allow: []
  deny: []
  block_mode: zero_ip    # zero_ip | nxdomain | refused | nodata | custom_ip
  block_ipv4: 0.0.0.0
  block_ipv6: "::"
  cname_inspect: true
  ip_sources: []         # lists of IPs/CIDRs; an answer pointing into one is
                         # blocked whatever its name was. RPZ `rpz-ip` triggers
                         # in any source above land in the same matcher.
  block_answer_ips: true
  ede: true              # RFC 8914: attach the reason for a block to the response
  ctags: []              # client tags a rule's $ctag modifier can select on
  # Substrings marking a source as protective (malware/phishing/threat feeds).
  # These are judged on coverage, not hit rate: a threat feed that never fires
  # means the network is clean, which is the outcome you paid for. Names
  # matching well-known threat-feed conventions are detected anyway.
  protective_sources: []
  # Serve an explainer page on the block IP, so a blocked request lands on
  # something that says why rather than on a connection error.
  block_page: false
  block_page_host: 0.0.0.0
  block_page_port: 8088
  ech: pass              # pass | strip — the `ech` parameter in HTTPS/SVCB
                         # answers. Stripping downgrades clients to a visible
                         # TLS server name and buys this resolver nothing.
  assertions: []         # what the policy must always do, checked against every
                         # refresh; a refresh that breaks one is not adopted:
    # - "bank.example must resolve"
    # - "doubleclick.net must block"
  groups: {}             # per-group lists, selected by clients[].group:
    # kids:
    #   sources: ["https://example.org/social.txt"]
    #   deny: ["tiktok.com"]
    #   inherit: true    # false = this list is the whole policy for the group

# --- per-client policy (identify by ip | cidr | mac | clientid | token) ---
clients: []
  # - {ident: 192.168.1.50, type: ip, name: kids-tablet, safe_search: true,
  #    safe_browse: true, parental: true, services: [youtube, tiktok],
  #    group: kids, upstream_group: family}
  # - {ident: 192.168.1.0/24, type: cidr, name: lan, tags: [household]}

# --- device names in the console, from reverse lookups to the router ---
# Only private addresses are looked up, and only against the router's reverse
# zone when upstream.servers routes it ([/1.168.192.in-addr.arpa/]192.168.1.1)
# or against `server`, which must itself be a private address. Nothing is
# looked up at querylog.privacy_level 1 or higher. Names you set above win.
client_names:
  reverse_lookup: true
  server: ""             # e.g. 192.168.1.1; empty = use the routed reverse zone
  refresh_hours: 6.0     # how long a name is kept before it is asked again
  hide_random: true      # hide UUID/MAC-like names (Apple private addresses)

# --- authoritative zones + local DNS ---
zones: []
# Shared secrets for authenticating zone transfers, NOTIFY and dynamic UPDATE.
# A zone names one in `zones[].tsig_key`; without it those operations are
# authorised by client address alone.
tsig_keys: []
  # - name: xfr.
  #   algorithm: hmac-sha256
  #   secret: "<base64>"
# Zones this server slaves from a primary: it pulls them over AXFR/IXFR and
# answers authoritatively for what it pulled.
secondaries: []
  # - origin: example.com.
  #   primary: 192.0.2.1
  #   port: 53
  #   key: xfr.           # a name from tsig_keys above
  # - {origin: home.lan., file: /etc/trench/home.zone, dnssec: true}
local_records: []
  # - {name: nas.home.lan, type: A, answer: 192.168.1.10}

# --- plugins ---
plugins: []
  # - dns64
  # - {name: block_tld, options: {tlds: [zip, mov]}}

# --- security hardening ---
security:
  # Who may resolve through plain DNS (port 53, UDP and TCP), as CIDRs. Empty
  # means "local": loopback, the private ranges, CGNAT/Tailscale and every
  # network attached to this host (so a LAN on global IPv6 works). Anyone else
  # gets REFUSED, so a listener the internet can reach is not an open resolver.
  # Add networks with ["local", "203.0.113.0/24"]; ["0.0.0.0/0", "::/0"] opts
  # into an open resolver. Authoritative zones answer everyone, and DoT/DoH/DoQ
  # are not restricted (they cannot be used for reflection).
  recursion_clients: []
  # Queries/sec per client (0 = off). A good idea on any LAN listener, and
  # essential if recursion_clients reaches beyond the local networks: Trench
  # warns at startup if it finds this at 0 then. 100/200 suits a home LAN.
  rate_limit: 0
  rate_burst: 0
  # Peers whose X-Forwarded-For header may be believed, as IPs or CIDRs.
  # Empty (the default) means the socket address always wins. Only add the
  # reverse proxy in front of DoH or the console: the header is written by
  # whoever sent the request, and the identity it sets picks the per-client
  # policy, the rate-limit bucket, the lockout counter and the ECS subnet.
  trusted_proxies: []
  rebinding_protection: true
  dns_cookies: false     # RFC 7873 server cookies (anti-spoof / anti-amplification)
  local_suffixes: [lan, local, home.arpa, internal, localhost]
  use_0x20: false
  dga_detection: false   # real-time detection of algorithmically-generated (malware C2) domains
  dga_block: false       # block flagged names (else just flag + count)
  dga_threshold: 0.62
  tunnel_detection: false  # detect DNS tunneling / data exfiltration (iodine, dnscat2)
  tunnel_block: false
  tunnel_threshold: 0.45
  block_doh_canary: true  # NXDOMAIN use-application-dns.net so Firefox keeps respecting this server
  silence_ledger: true    # track devices still on the network that have stopped
                          # asking us anything — the visible trace of an app
                          # using its own encrypted resolver. Reports; never blocks.
  notary: []              # names resolved through every upstream and compared;
                          # disagreement is reported, never acted on:
    # - bank.example
  notary_interval: 3600   # seconds between rounds; 0 disables

# --- integrated DHCP (DISABLED; also needs `--allow-dhcp` to bind :67) ---
dhcp:
  enabled: false
  server_ip: ""
  scope: null
  register_dns: true      # publish leased hostnames as <name>.<domain> + PTR
  # scope:
  #   network: 192.168.1.0/24
  #   range_start: 192.168.1.100
  #   range_end: 192.168.1.200
  #   router: 192.168.1.1
  #   dns: [192.168.1.1]
  #   lease_time: 86400

querylog:
  enabled: true
  retention_days: 90
  privacy_level: 0       # 0 all .. 3 no logging
  db: trench.db
  export: ""             # also stream every query as JSON lines to this path
                         # ("-" for stdout) for a log shipper or jq

gravity:
  refresh_hours: 24

# Updates. `notify` checks on a timer and tells you; it never installs.
# `auto` also installs, but only where Trench owns the installation (a
# virtual environment it can write to — never a container image, a distro
# package or a source checkout), only outside a running blocklist build, and
# only inside `window` if one is set. `off` disables the check entirely.
updates:
  mode: notify                # off | notify | auto
  channel: stable             # stable | prerelease
  check_interval_hours: 24    # 0 stops checking
  index: "https://api.github.com/repos/dev-doshi/trench/releases?per_page=100"
  timeout: 15.0
  window: ""                  # "03:00-05:00" local time, may wrap midnight
  # Installing stages new code; the running process keeps serving the old code
  # until something restarts it. `systemd` asks systemd to restart `unit`,
  # which needs Trench to still have the privilege to talk to it.
  restart: manual             # manual | systemd
  unit: trench

# Automatic TLS certificates over ACME dns-01. Needs `zones` to contain the name
# being certified — this server answers the challenge from its own zone, so
# nothing has to be reachable from the internet. See docs/security.md.
acme:
  enabled: false
  domains: []
  email: ""
  directory: "https://acme-v02.api.letsencrypt.org/directory"
  settle: 0.0            # seconds to wait after publishing the challenge before
                         # asking the CA to look. 0 is right when this server
                         # answers the query itself; raise it when a secondary
                         # has to pull the zone first.

web:
  enabled: true
  host: 127.0.0.1
  port: 8089
  admin_password: null   # null -> autogenerated and printed once at first start
  tls: false             # leave the console on 127.0.0.1 while this is false:
                         # without TLS the password and API tokens are sent in
                         # the clear

log:
  level: info
  json_logs: false
