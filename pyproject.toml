[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# `trench` is taken on PyPI, so the distribution carries a suffix. It is the
# only place the project is not simply called Trench: the import package,
# both commands, the service and the image are all `trench`.
name = "trench-dns"
# Read from trench/version.py so the package, the CLI's --version and the
# User-Agent Trench puts on the wire can never disagree.
dynamic = ["version"]
description = "Self-hosted DNS sinkhole, validating recursive resolver, and authoritative server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trench contributors" }]
keywords = ["dns", "adblock", "sinkhole", "resolver", "dnssec", "doh", "dot", "doq", "pihole"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9",
    "aioquic>=1.0",
    "cryptography>=42",
    "pydantic>=2.5",
    "aiosqlite>=0.19",
    "pyyaml>=6.0",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "dnspython>=2.6",
    "ruff>=0.5",
    "mypy>=1.8",
    "coverage>=7",
    "pytest-cov>=5",
    "types-PyYAML",
]
docs = [
    # Capped: MkDocs 2.0 removes the plugin system and rewrites theming, with
    # no migration path, so an unpinned docs build would break on release day.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[project.urls]
Homepage = "https://github.com/dev-doshi/trench"
Documentation = "https://dev-doshi.github.io/trench/"
Source = "https://github.com/dev-doshi/trench"
Issues = "https://github.com/dev-doshi/trench/issues"
Changelog = "https://github.com/dev-doshi/trench/blob/main/CHANGELOG.md"

[project.scripts]
trench = "trench.cli.main:main"
trenchd = "trench.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "trench.version.__version__" }

[tool.setuptools.packages.find]
include = ["trench*"]

# The seed blocklist lives inside the package, not at the repo root: a
# `../data` glob cannot be honoured by a wheel, so an installed Trench had
# no copy of it at all.
[tool.setuptools.package-data]
trench = ["data/*.txt", "web/dist/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The tests import `trench` from the checkout rather than from an installed
# wheel, so a bare `pytest` in a fresh clone has to be able to find it. Without
# this every test file fails to collect and the first thing a new contributor
# sees is 80-odd import errors.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105", "E702", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# The dev harness inserts the repo root on sys.path so it can be run from any
# working directory; its trench imports have to come after that.
"scripts/uidev.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true
