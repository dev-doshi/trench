# The label taxonomy, and the source of truth for it.
#
# `scripts/sync_labels.py` reconciles the repository against this file, so a
# label is created, recoloured or re-described by editing it here — not in the
# web UI, where the change is invisible to review and drifts back on the next
# sync.
#
# Every label an issue form applies must exist here; `scripts/check_templates.py`
# fails CI if a form references one that does not.
#
# Four groups, and nothing else. A label earns its place only if someone
# filters on it: anything GitHub already models — assignees, linked pull
# requests, pinned issues, "closed as duplicate", "closed as not planned" —
# is not duplicated here as a label.

# ── type: what kind of thing this is. Exactly one, applied by the form. ─────
- name: type/bug
  color: d73a4a
  description: Behaviour that is wrong
- name: type/enhancement
  color: a2eeef
  description: A capability or behaviour change that does not exist yet
- name: type/docs
  color: 0075ca
  description: Documentation is wrong, missing, or unclear
- name: type/security
  color: b60205
  description: Security-relevant and already public (private reports go through advisories)

# ── area: which part it lands in. Zero or more, applied by triage. ──────────
# Grouped by what a reporter can observe, not by the module tree: "the answer
# was wrong" and "the answer never came" are both area/resolution even though
# they are four packages apart.
- name: area/resolution
  color: 0e8a16
  description: Recursion, forwarding, DNSSEC validation, the cache, the wire format
- name: area/filtering
  color: 0e8a16
  description: Blocklists, rules, groups, safe search, blocked services
- name: area/transport
  color: 0e8a16
  description: Do53, DoT, DoH, DoQ, DoH3, connection handling, discovery
- name: area/authoritative
  color: 0e8a16
  description: Zones, XFR, NOTIFY, dynamic update, TSIG, online signing
- name: area/dhcp
  color: 0e8a16
  description: DHCP server and lease-derived names
- name: area/console
  color: 0e8a16
  description: The web console and the admin HTTP API
- name: area/data
  color: 0e8a16
  description: Query log, statistics, export, retention, persistence
- name: area/cli
  color: 0e8a16
  description: The command-line interface
- name: area/packaging
  color: 0e8a16
  description: Wheels, Docker image, systemd unit, install, upgrade
- name: area/performance
  color: 0e8a16
  description: Speed, memory, stability under load

# ── status: only the states that change what happens next. ──────────────────
# There is no needs-triage label: an issue with no status is untriaged. There
# is no in-progress label: an assignee or a linked pull request says that.
- name: status/needs-info
  color: fbca04
  description: Waiting on the reporter — the stale bot sweeps only this
- name: status/confirmed
  color: fbca04
  description: Reproduced, and accepted as a defect
- name: status/blocked
  color: fbca04
  description: Waiting on something outside this repository

# ── priority: only the two that reorder the queue. ──────────────────────────
# Unlabelled is normal. "Someday" is what an open issue already means.
- name: priority/critical
  color: b60205
  description: Resolution is broken, data is at risk, or it is exploitable
- name: priority/high
  color: d93f0b
  description: Next

# ── meta ────────────────────────────────────────────────────────────────────
- name: good first issue
  color: 7057ff
  description: Small, self-contained, with a clear finish line
- name: help wanted
  color: 008672
  description: Contributions especially welcome here
- name: breaking-change
  color: b60205
  description: Changes configuration, defaults, or on-the-wire behaviour
- name: dependencies
  color: 0366d6
  description: Dependency updates
- name: stale
  color: ededed
  description: Inactive, and heading for automatic closure
