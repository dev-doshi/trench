name: "Performance, memory, or stability"
description: Slow answers, growing memory, an OOM kill, a crash, or a restart loop
title: "[perf] "
labels: ["type/bug", "area/performance", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Trench is expected to run on small hardware, so "it got killed on a
        Pi" is a real bug and not a configuration mistake. The numbers below
        are what make it actionable.

  - type: dropdown
    id: symptom
    attributes:
      label: What is wrong
      options:
        - Memory grows over time
        - Killed by the OOM killer
        - Process crashed or exited
        - Restart loop
        - Queries are slow
        - CPU pegged
        - Disk filling up
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware and memory
      placeholder: "Raspberry Pi 4, 2 GB, 32 GB SD card"
    validations:
      required: true

  - type: input
    id: limits
    attributes:
      label: Memory limits in force
      description: "`MemoryMax=` from the unit file, or `mem_limit` from Compose, or none."
      placeholder: "MemoryMax=700M"
    validations:
      required: true

  - type: input
    id: rate
    attributes:
      label: Query rate
      description: Roughly, and how many clients.
      placeholder: "~30 q/s, 25 devices"

  - type: textarea
    id: numbers
    attributes:
      label: The numbers
      description: >
        RSS over time if you have it (`ps -o rss= -p $(pidof trenchd)`),
        `trench stats`, cache size, and the size of `data/` — especially the
        query-log database.
      render: shell
    validations:
      required: true

  - type: input
    id: lists
    attributes:
      label: Blocklists in use
      description: How many sources, and roughly how many rules compile out of them.
      placeholder: "4 HaGeZi lists, ~1.2M rules"

  - type: textarea
    id: when
    attributes:
      label: When does it happen?
      description: >
        During a blocklist refresh, at startup, under load, after N days of
        uptime? A refresh is the single most memory-hungry moment, so say if
        it lines up with one.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, kernel messages, or the systemd journal
      description: "`journalctl -u trench -n 200`, plus `dmesg | grep -i oom` for a kill."
      render: shell

  - type: input
    id: version
    attributes:
      label: Trench version
      placeholder: "2.0.0"
    validations:
      required: true
