name: Feature request
description: Suggest a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that DNSGuard makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: input
    id: rfc
    attributes:
      label: Relevant RFC or specification
      description: If this changes what goes on the wire, name the RFC and section.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
