name: "Install, packaging, or deployment"
description: It will not install, build, start, or upgrade
title: "[packaging] "
labels: ["type/bug", "area/packaging", "status/needs-triage"]
body:
  - type: dropdown
    id: method
    attributes:
      label: How are you installing or running it?
      options:
        - Docker image
        - Docker Compose
        - systemd unit
        - pip / pipx
        - From source
        - Kubernetes or other orchestrator
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - Building the image or the wheel
        - Installing
        - First start
        - Start after an upgrade
        - Shutdown or restart
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, architecture, and Python version
      placeholder: "Debian 12, arm64, Python 3.11.2"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command, and everything it printed
      render: shell
    validations:
      required: true

  - type: textarea
    id: compose
    attributes:
      label: Compose file or unit file
      description: If you changed it from the shipped one, the diff is enough.
      render: yaml

  - type: input
    id: version
    attributes:
      label: Trench version or tag
      placeholder: "2.0.0, or the git SHA"
    validations:
      required: true
