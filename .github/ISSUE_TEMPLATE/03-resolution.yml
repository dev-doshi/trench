name: "Resolution failure"
description: A name will not resolve — SERVFAIL, NXDOMAIN, timeouts, or DNSSEC bogus
title: "[resolution] "
labels: ["type/bug", "area/resolver", "status/needs-triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I checked whether the same query fails against a public resolver too (see below).
          required: true

  - type: input
    id: name
    attributes:
      label: The name and type that fails
      placeholder: "example.com A"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What comes back
      options:
        - SERVFAIL
        - NXDOMAIN for a name that exists
        - NOERROR but with no answer records
        - Timeout / no response at all
        - Wrong or stale answer data
        - DNSSEC validation failure (bogus)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Resolver mode
      options:
        - Recursive (resolving from the root)
        - Forwarding to upstream resolvers
        - Both, depending on the client or group
    validations:
      required: true

  - type: textarea
    id: dig
    attributes:
      label: "`dig` against Trench"
      description: Please include `+dnssec`, and the full response, not just the answer line.
      render: shell
      placeholder: |
        $ dig @192.168.1.2 example.com A +dnssec
    validations:
      required: true

  - type: textarea
    id: control
    attributes:
      label: The same query against a public resolver
      description: >
        `dig @1.1.1.1 <name> <type> +dnssec` — this separates "Trench is
        wrong" from "the zone is broken", which is the first thing anyone
        triaging this will check.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs with `log.level: debug`"
      description: >
        For a DNSSEC failure the validator logs which link in the chain
        failed; that line is the whole report.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Upstream and DNSSEC configuration
      render: yaml

  - type: input
    id: version
    attributes:
      label: Trench version
      placeholder: "2.0.0"
    validations:
      required: true
