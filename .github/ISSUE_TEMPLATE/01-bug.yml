name: Bug report
description: Trench resolves, blocks, or serves something incorrectly
title: "[bug] "
labels: ["type/bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Not the right form?**

        * A name is blocked that should not be, or slips through that should
          not — use *Filtering: wrong verdict* instead.
        * A name fails to resolve at all (SERVFAIL, NXDOMAIN, DNSSEC bogus) —
          use *Resolution failure* instead.
        * A security vulnerability — do **not** open an issue. Report it
          privately: <https://github.com/dev-doshi/trench/security/advisories/new>

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on a supported version (the latest release, or `main`).
          required: true
        - label: I have removed secrets from the config and logs I am pasting.
          required: true

  - type: input
    id: version
    attributes:
      label: Trench version
      description: Output of `trench --version`.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Trench
      description: Best guess is fine — this only routes the issue.
      options:
        - Not sure
        - Recursive resolver / upstream forwarding
        - DNSSEC validation
        - Filtering / blocklists / rules
        - Answer cache
        - Fast path (repeat-query replay)
        - Transports (Do53, DoT, DoH, DoQ)
        - Authoritative zones / XFR / dynamic update
        - DHCP server / lease-derived names
        - Admin API
        - Admin console (web UI)
        - Query log / statistics / export
        - CLI
        - Packaging, Docker, or systemd
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options: [Docker, systemd, from source, pip install, other]
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      description: Distribution and CPU architecture, plus the board if it is one.
      placeholder: "Raspberry Pi OS 12, arm64, Pi 4 (2 GB)"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The query that shows it, as a `dig` line, plus the answer you got. A
        packet capture (`tcpdump -i any -w dns.pcap port 53`) helps for
        anything on the wire.
      render: shell
      placeholder: |
        $ dig @192.168.1.2 example.com A +dnssec
        ...
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: How often does it reproduce?
      placeholder: "Every time / roughly one query in 50 / once since Tuesday"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The relevant part of `trench.yaml`, with secrets removed.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run with `log.level: debug` if the cause is not obvious."
      render: shell

  - type: textarea
    id: regression
    attributes:
      label: Did this work before?
      description: If it is a regression, the last version that worked is the most useful thing in this form.
