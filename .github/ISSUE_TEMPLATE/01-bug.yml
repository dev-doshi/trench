name: Bug report
description: Something Trench does is wrong — a verdict, an answer, the console, a crash, an install
title: "[bug] "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        One form covers every kind of defect. The **symptom** you pick below
        decides which diagnostics are worth pasting — there is a checklist for
        each one further down, so fill that in and skip the rest.

        A security vulnerability does **not** belong here. Report it privately:
        <https://github.com/dev-doshi/trench/security/advisories/new>

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on a supported version (the latest release, or `main`).
          required: true
        - label: I have removed secrets from the config and logs I am pasting.
          required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What is wrong
      options:
        - A name is blocked that should resolve
        - A name resolves that should be blocked
        - A name will not resolve at all — SERVFAIL, NXDOMAIN, or a timeout
        - The answer is wrong — wrong record, wrong TTL, or DNSSEC bogus
        - Memory growth, an OOM kill, a crash, a restart loop, or slow answers
        - The console or the HTTP API misbehaves
        - It will not install, start, or upgrade
        - Something else
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Trench
      description: Best guess is fine — this only routes the issue.
      options:
        - Not sure
        - Resolution — recursion, forwarding, DNSSEC, cache
        - Filtering — blocklists, rules, groups, safe search, services
        - Transports — Do53, DoT, DoH, DoQ, DoH3, discovery
        - Authoritative zones — XFR, dynamic update, signing
        - DHCP server
        - Console or admin API
        - Query log, statistics, or export
        - CLI
        - Packaging — Docker, systemd, pip, upgrade
        - Performance, memory, or stability
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Trench version
      description: Output of `trench --version`.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options: [Docker, systemd, from source, pip install, other]
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS, architecture, and hardware
      description: Distribution and CPU architecture, plus the board and its RAM if it is one.
      placeholder: "Raspberry Pi OS 12, arm64, Pi 4 (2 GB)"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected instead
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: How often does it reproduce?
      placeholder: "Every time / roughly one query in 50 / once since Tuesday"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Diagnostics

        Paste whatever your symptom asks for. This is the part that decides
        whether the issue can be worked on or has to wait for a round trip.

        | Symptom | What makes it actionable |
        |---|---|
        | Wrong verdict (blocked / not blocked) | `trench why <name>` — it names the rule, the list it came from, and the policy that applied — plus which `filtering.sources` are enabled |
        | Will not resolve | `dig @<trench> <name> <type> +dnssec`, then the same query against `1.1.1.1` or `8.8.8.8` for comparison |
        | Wrong answer | The `dig` output next to what you expected, and a capture if it is on the wire: `tcpdump -i any -w dns.pcap port 53` |
        | Memory, crash, or slowness | RSS over time (`ps -o rss= -p $(pidof trenchd)`), `trench stats`, the size of `data/`, any `MemoryMax=` / `mem_limit` in force, the query rate, and whether it lines up with a blocklist refresh |
        | Console or API | The browser console and network tab after a cache-bypassing reload — the console is a committed build, so a stale bundle looks like a bug — or the failing request and its response |
        | Install, start, or upgrade | The exact command and its complete output |

  - type: textarea
    id: repro
    attributes:
      label: Reproduction and diagnostics
      description: The commands you ran and their output, from the table above.
      render: shell
      placeholder: |
        $ trench why ads.example --client 192.168.1.50
        ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        The relevant part of `trench.yaml`, with secrets removed. If this only
        happens for some clients, include the client entry, its filtering group
        and upstream group.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Run with `log.level: debug` if the cause is not obvious.
        `journalctl -u trench -n 200` under systemd; add `dmesg | grep -i oom`
        for a kill.
      render: shell

  - type: input
    id: regression
    attributes:
      label: Did this work before?
      description: If it is a regression, the last version that worked is the most useful thing in this form.
      placeholder: "Worked in 1.9.2 / never worked / do not know"
