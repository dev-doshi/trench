name: Labels

# The label set is code: it lives in .github/labels.yml and is applied from
# there. Runs on a push that touches the manifest, and on demand.
on:
  push:
    branches: [main]
    paths: [".github/labels.yml", "scripts/sync_labels.py"]
  workflow_dispatch:
    inputs:
      prune:
        description: "Also delete labels the manifest does not list (destructive)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Apply the manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_labels.py \
            --repo "${{ github.repository }}" \
            ${{ inputs.prune && '--prune' || '' }}
