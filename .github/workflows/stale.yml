name: Stale

# Issues waiting on a reporter go quiet and stay open for ever. Only two
# states are swept, both of which mean "we asked and heard nothing":
# status/needs-info and status/needs-triage. Confirmed defects are never
# closed by a robot — an unfixed bug does not stop being a bug.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 21
          only-labels: "status/needs-info"
          stale-issue-label: stale
          exempt-issue-labels: "pinned,status/confirmed,status/in-progress,status/blocked,type/security,priority/critical,priority/high"
          stale-issue-message: >
            This has been waiting on more information for 45 days. If it is
            still happening, reply with what was asked for and it will be
            picked back up — including after it closes. Closing is
            bookkeeping, not a verdict.
          close-issue-message: >
            Closing after 21 more quiet days. Comment any time to reopen; the
            report is not lost.
          days-before-pr-stale: 60
          days-before-pr-close: 30
          stale-pr-label: stale
          exempt-pr-labels: "pinned,status/in-progress"
          stale-pr-message: >
            This pull request has been quiet for 60 days. Push, comment, or
            say what it is waiting on, and it stays open.
          close-pr-message: >
            Closing after 30 more quiet days. Reopen whenever you want to pick
            it back up.
          operations-per-run: 200
          ascending: true
