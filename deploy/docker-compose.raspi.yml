services:
  trench:
    build:
      context: ..
      dockerfile: Dockerfile
    image: trench:latest
    container_name: trench
    restart: unless-stopped
    network_mode: host # required to serve LAN DNS on :53
    # Everything dropped, then the single capability binding :53 needs.
    # cap_add alone leaves a root container holding CHOWN, SETUID,
    # NET_RAW and the rest of the default set.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :53 / :853
      - SETUID             # server.user: shed root once the ports are bound
      - SETGID             # ...and the matching group

    # --- memory safety -----------------------------------------------------
    # Without a limit, a blocklist rebuild spike lets the kernel OOM-killer
    # pick victims anywhere on the host, which is how a 1 GB Pi locks up.
    # With a limit the container is the only thing that can die, and `restart`
    # brings it straight back. memswap_limit == mem_limit disables swap for the
    # container: swapping a DNS resolver on an SD card is worse than restarting.
    mem_limit: 700m
    memswap_limit: 700m
    mem_reservation: 300m
    oom_kill_disable: false

    healthcheck:
      # The image ships the probe. The old inline one asked for a real name
      # (www.example.com), so an upstream outage marked the container
      # unhealthy even though it was answering perfectly well; it also
      # accepted any UDP packet as a reply rather than matching the query id.
      test: ["CMD", "python3", "/usr/local/bin/trench-healthcheck"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s # blocklist compile takes a while on a Pi

    volumes:
      # Writable, so Settings in the console can save. It was :ro, which made
      # every control in that page fail at the last step. A container that could
      # be made to rewrite this file already controls resolution, the blocklists
      # and the query log, so the flag was buying very little.
      - ./raspi.yaml:/data/trench.yaml
      - trench-data:/data
    environment:
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  trench-data:
